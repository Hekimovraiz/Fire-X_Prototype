function b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x040810);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
camera.position.set(0, -155, 95);
camera.up.set(0, 0, 1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 22);
controls.enableDamping = true;
controls.update();

// Grid & lights
const grid = new THREE.GridHelper(240, 24, 0x00F5FF, 0x1E293B);
grid.rotation.x = Math.PI / 2;
scene.add(grid);

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dir1 = new THREE.DirectionalLight(0xffffff, 0.85);
dir1.position.set(-80, -120, 140);
scene.add(dir1);
const dir2 = new THREE.DirectionalLight(0x00F5FF, 0.45);
dir2.position.set(100, 100, 60);
scene.add(dir2);

const loader = new THREE.STLLoader();
const geoTop = loader.parse(b64ToArrayBuffer(B64_TOP));
const geoBot = loader.parse(b64ToArrayBuffer(B64_BOT));
geoTop.computeVertexNormals();
geoBot.computeVertexNormals();

const matTop = new THREE.MeshStandardMaterial({ color: 0x1E293B, roughness: 0.35, metalness: 0.25 });
const matBot = new THREE.MeshStandardMaterial({ color: 0x00C896, roughness: 0.4, metalness: 0.2 });

const meshTop = new THREE.Mesh(geoTop, matTop);
const meshBot = new THREE.Mesh(geoBot, matBot);
scene.add(meshTop);
scene.add(meshBot);

let targetZ = 0.2;
function setMode(mode) {
  document.querySelectorAll("#topbar button").forEach(b => { if (b.id !== "btn-wire") b.classList.remove("active"); });
  if (mode === "assembled") {
    document.getElementById("btn-asm").classList.add("active");
    meshTop.visible = true; meshBot.visible = true; targetZ = 0.2;
  } else if (mode === "exploded") {
    document.getElementById("btn-exp").classList.add("active");
    meshTop.visible = true; meshBot.visible = true; targetZ = 32.0;
  } else if (mode === "top") {
    document.getElementById("btn-top").classList.add("active");
    meshTop.visible = true; meshBot.visible = false; targetZ = 0.0;
  } else if (mode === "bot") {
    document.getElementById("btn-bot").classList.add("active");
    meshTop.visible = false; meshBot.visible = true; targetZ = 0.0;
  }
}

function toggleWire() {
  matTop.wireframe = !matTop.wireframe;
  matBot.wireframe = matTop.wireframe;
  document.getElementById("btn-wire").classList.toggle("active", matTop.wireframe);
}

function animate() {
  requestAnimationFrame(animate);
  meshTop.position.z += (targetZ - meshTop.position.z) * 0.12;
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
